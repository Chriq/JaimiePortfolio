<div class="testimonial-container bg-reveal" swipeReveal>
    <h2>TESTIMONIALS</h2>
    <app-carousel [items]="testimonials">
        <ng-template let-t>
            <div style="justify-items: center;">
                <h3>
                    {{t.name}} ("{{t.project}}"
                    @if(t.year) {
                    , {{t.year}}
                    }
                    )
                </h3>
                <p class="text-container text-reveal" swipeReveal>{{t.quote}}</p>
            </div>
        </ng-template>
    </app-carousel>

</div>
